name: Recruiting Bot
on:
  pull_request:
    paths: ['services/recruiting-bot/**', '.github/workflows/recruiting-bot.yml']
  push:
    paths: ['services/recruiting-bot/**', '.github/workflows/recruiting-bot.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/recruiting-bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache-dependency-path: services/recruiting-bot/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: go test -race ./...
      - run: go vet ./...
      - run: node --check web/app.js
      - run: CGO_ENABLED=0 go build ./...
